name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter indexer codegen
      - run: pnpm --filter app exec tsc --noEmit
      - run: pnpm --filter services exec tsc --noEmit
      - run: pnpm --filter app test -- --ci
      - run: pnpm --filter indexer test
      - run: pnpm --filter services test
